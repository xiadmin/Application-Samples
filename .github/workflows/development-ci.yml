name: Development CI

on:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: development-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            verify-platform: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            verify-platform: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install XIMEA SDK
        run: python3 scripts/ci/install-ximea-sdk.py --platform linux
      - name: Verify XIMEA SDK
        run: python3 scripts/ci/verify-ximea-sdk.py --platform ${{ matrix.verify-platform }}
      - name: Build and attempt C/C++ cross-platform samples
        run: |
          python3 scripts/build.py --all --type cmake --skip-platform-specific \
            --run --run-timeout-seconds 90 \
            --output-root "$RUNNER_TEMP/application-samples-linux-${{ matrix.arch }}"
      - name: Compile-check and attempt cross-platform Python sample
        run: |
          python3 scripts/build.py --all --type python --skip-platform-specific \
            --run --run-timeout-seconds 90 \
            --output-root "$RUNNER_TEMP/application-samples-linux-${{ matrix.arch }}-python"

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install XIMEA SDK
        run: python scripts/ci/install-ximea-sdk.py --platform windows
      - name: Verify XIMEA SDK
        shell: pwsh
        run: python scripts/ci/verify-ximea-sdk.py --platform windows-x64
      - name: Build and attempt C/C++ cross-platform samples
        shell: pwsh
        run: |
          python scripts/build.py --all --type cmake --skip-platform-specific `
            --run --run-timeout-seconds 90 `
            --output-root "$env:RUNNER_TEMP/application-samples-windows-x64"
      - name: Build and attempt C# sample
        shell: pwsh
        run: |
          python scripts/build.py --all --type dotnet `
            --run --run-timeout-seconds 90 `
            --output-root "$env:RUNNER_TEMP/application-samples-windows-x64-dotnet"
      - name: Compile-check and attempt cross-platform Python sample
        shell: pwsh
        run: |
          python scripts/build.py --all --type python --skip-platform-specific `
            --run --run-timeout-seconds 90 `
            --output-root "$env:RUNNER_TEMP/application-samples-windows-x64-python"

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            verify-platform: macos-x64
          - arch: arm64
            runner: macos-15
            verify-platform: macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install XIMEA SDK
        run: python3 scripts/ci/install-ximea-sdk.py --platform macos
      - name: Verify XIMEA SDK
        run: python3 scripts/ci/verify-ximea-sdk.py --platform ${{ matrix.verify-platform }}
      - name: Build and attempt C/C++ cross-platform samples
        run: |
          python3 scripts/build.py --all --type cmake --skip-platform-specific \
            --run --run-timeout-seconds 90 \
            --output-root "$RUNNER_TEMP/application-samples-macos-${{ matrix.arch }}"
      - name: Compile-check and attempt cross-platform Python sample
        run: |
          python3 scripts/build.py --all --type python --skip-platform-specific \
            --run --run-timeout-seconds 90 \
            --output-root "$RUNNER_TEMP/application-samples-macos-${{ matrix.arch }}-python"
